name: Build AD Pentest Companion v0.3 archive

on:
  push:
    branches: [main]
    paths:
      - 'tools/ad-companion/editions/v0.3/build_pdf.py'
      - 'tools/ad-companion/editions/v0.3/recipes.js'
      - 'tools/ad-companion/editions/v0.3/index.html'
      - 'tools/ad-companion/editions/v0.3/style.css'
      - 'tools/ad-companion/editions/v0.3/app.js'
      - '.github/workflows/ad-companion-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Generate PDF and standalone offline HTML
        run: |
          python tools/ad-companion/editions/v0.3/build_pdf.py
          python - <<'PY'
          from pathlib import Path
          p = Path("tools/ad-companion/editions/v0.3")
          page = (p / "index.html").read_text()
          page = page.replace('<link rel="stylesheet" href="style.css">', '<style>\n' + (p / "style.css").read_text() + '\n</style>')
          page = page.replace('<script src="recipes.js"></script>', '<script>\n' + (p / "recipes.js").read_text() + '\n</script>')
          page = page.replace('<script src="app.js"></script>', '<script>\n' + (p / "app.js").read_text() + '\n</script>')
          (p / "AD_Pentest_Companion_v0.3_Offline.html").write_text(page)
          PY
      - name: Commit generated downloadable files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ad-companion/editions/v0.3/Active_Directory_Pentest_Companion_v0.3.pdf
          git add tools/ad-companion/editions/v0.3/AD_Pentest_Companion_v0.3_Offline.html
          if ! git diff --cached --quiet; then
            git commit -m "docs(ad-companion): generate v0.3 PDF and offline release"
            git push
          fi
