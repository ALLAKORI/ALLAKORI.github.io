name: Verify CTF images
on:
  push:
    branches:
      - fix-ctf-team-image-2026-11-03
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CTF photo and public site
        run: |
          python -m pip -q install pillow requests
          python - <<'PY'
          import os,requests,io
          from PIL import Image
          root="assets/ctf/"
          for f in ["csia-ctf-2026-team-photo.jpg","csia-ctf-2026-photo.jpg","csia-scoreboard.png","ghostshell-first-place.png"]:
            p=root+f
            print("LOCAL",p,os.path.getsize(p),open(p,'rb').read(16).hex(),flush=True)
            try:
              im=Image.open(p); im.load()
              print("PIL_OK",p, im.format,im.size,im.mode, flush=True)
            except Exception as e:print("PIL_FAIL",p,str(e),flush=True)
          for f in ["csia-ctf-2026-team-photo.jpg","csia-ctf-2026-photo.jpg","csia-scoreboard.png"]:
            for host in ["https://allakori.github.io/assets/ctf/","https://raw.githubusercontent.com/ALLAKORI/ALLAKORI.github.io/main/assets/ctf/"]:
              u=host+f
              try:
                r=requests.get(u,timeout=18)
                print("LIVE",u,"STATUS",r.status_code,"TYPE",r.headers.get("content-type"),"LENGTH",len(r.content),"HEADER",r.content[:16].hex(),flush=True)
                if r.status_code==200:
                  try:
                    im=Image.open(io.BytesIO(r.content));im.load()
                    print("LIVE_PIL_OK", f, im.size,im.mode,flush=True)
                  except Exception as e:print("LIVE_PIL_FAIL",f,str(e),flush=True)
              except Exception as e: print("LIVE_FAIL",u,str(e),flush=True)
          PY

      - name: Check image in Chromium on the live site
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            for(const url of ['https://allakori.github.io/','https://allakori.github.io/proof.html']) {
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              page.on('requestfailed',q=>console.log('FAILED_REQUEST',q.url(),q.failure()));
              page.on('response',r=>{if(r.url().includes('csia-ctf-2026-team-photo'))console.log('IMG_RESPONSE',r.status(),r.url())});
              await page.goto(url,{waitUntil:'networkidle'});
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.waitForTimeout(1500);
              const out=await page.evaluate(()=>{
                return Array.from(document.querySelectorAll('img')).filter(i=>i.src.includes('csia-ctf-2026-team-photo')).map(i=>({src:i.src,currentSrc:i.currentSrc,complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,loading:i.loading,outerHTML:i.outerHTML.slice(0,600),rect:i.getBoundingClientRect().toJSON()}));
              });
              console.log('PAGE_IMAGE_STATUS',url,JSON.stringify(out));
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
