name: Portfolio visual review (temporary)
on:
  push:
    branches:
      - portfolio-recruiter-review-2026-11
jobs:
  browser-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Visual and functional checks
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const path=require('path');
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const base='file://'+process.cwd()+'/';
            let failed=false;
            for (const size of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]) {
              const page=await b.newPage({viewport:{width:size.width,height:size.height},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              for(const filename of ['index.html','projects.html','cv.html']) {
                await page.goto(base+filename,{waitUntil:'load'});
                await page.waitForTimeout(500);
                const data=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,title:document.title,h1:document.querySelector('h1')?.innerText,links:[...document.querySelectorAll('a[href]')].length}));
                console.log('CHECK '+JSON.stringify({page:filename,viewport:size.name,...data,errors:errors.slice(-3)}));
                if(data.scroll>data.client+3){failed=true;console.log('FAIL_HORIZ_OVERFLOW '+filename+' '+size.name);}
                const jpeg=await page.screenshot({type:'jpeg',quality:43,fullPage:false});
                console.log('SHOT_'+size.name+'_'+filename.replace('.html','')+'_START');
                console.log(jpeg.toString('base64'));
                console.log('SHOT_'+size.name+'_'+filename.replace('.html','')+'_END');
                if (filename==='cv.html') {
                  const fr=page.locator('[data-lang-choice="fr"]');
                  if(await fr.count()){await fr.click();await page.waitForTimeout(250);}
                  const frText=await page.locator('.cv-section h2').first().textContent();
                  console.log('LANG_FR '+JSON.stringify({viewport:size.name,heading:frText}));
                  if(!frText.includes('Profil'))failed=true;
                  const pdf=await page.pdf({format:'A4',printBackground:false});
                  fs.writeFileSync('cv-print-'+size.name+'.pdf',pdf);
                  console.log('PDF_BYTES '+size.name+' '+pdf.byteLength);
                }
              }
              if(errors.length) {failed=true;console.log('PAGE_ERRORS '+errors.join(' / '));}
              await page.close();
            }
            await b.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
      - name: Record print-page count
        if: always()
        run: |
          python -m pip -q install pypdf
          python - <<'PY'
          from pypdf import PdfReader
          for kind in ('desktop','mobile'):
            p='cv-print-'+kind+'.pdf'
            import os
            if os.path.exists(p):
              print('CV_PRINT_PAGES',kind,len(PdfReader(p).pages))
          PY
